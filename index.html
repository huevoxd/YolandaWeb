<script>
  const obrasImages = [
    'ilustraciones/Página web/animales NO marinos/Araña.jpg',
    'ilustraciones/Página web/Paisaje/1.jpg',
    'ilustraciones/Página web/ilustraciones cientificas/Emiliania_Yolanda Ferrón.jpg',
    'ilustraciones/Página web/ilustraciones cientificas/Zostera marina_Yolanda Ferron Horcas.JPG',
    'ilustraciones/Página web/fauna marina/IMG_3485.JPG',
    'ilustraciones/Página web/fauna marina/medusaa.jpg',
    'ilustraciones/Página web/fauna marina/IMG_1904.JPG',
    'ilustraciones/Página web/fauna marina/IMG_2863.JPG',
    'ilustraciones/Página web/animales NO marinos/garra.jpg',
    'ilustraciones/Página web/animales NO marinos/pato.jpg',
    'ilustraciones/Página web/animales NO marinos/pa.jpg',
    'ilustraciones/Página web/animales NO marinos/liberula.jpg',
    'ilustraciones/Página web/animales NO marinos/flamenco.jpg'
  ];
  let obrasIndex = 0;
  const obrasCol = document.getElementById('obrasCol');
  function setObrasImage(i) {
    obrasIndex = (i + obrasImages.length) % obrasImages.length;
    obrasCol.style.backgroundImage = `url('${obrasImages[obrasIndex]}')`;
  }
  document.getElementById('obrasPrev').addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    setObrasImage(obrasIndex - 1);
  });
  document.getElementById('obrasNext').addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    setObrasImage(obrasIndex + 1);
  });

  const footerAvatar = document.getElementById('footerAvatar');
  const avatarBackdrop = document.getElementById('avatarBackdrop');
  function setAvatarExpanded(expand) {
    footerAvatar.classList.toggle('is-expanded', expand);
    avatarBackdrop.classList.toggle('is-visible', expand);
    footerAvatar.setAttribute('aria-expanded', expand);
  }
  footerAvatar.addEventListener('click', () => {
    setAvatarExpanded(!footerAvatar.classList.contains('is-expanded'));
  });
  footerAvatar.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setAvatarExpanded(!footerAvatar.classList.contains('is-expanded'));
    }
  });
  avatarBackdrop.addEventListener('click', () => setAvatarExpanded(false));
</script>

</body>
